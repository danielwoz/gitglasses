# Weekly update pull requests for the pnpm workspace and for the actions the
# workflows pin by commit. vcpkg dependencies move with the builtin-baseline
# in vcpkg.json, which Dependabot does not manage; bump it by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
