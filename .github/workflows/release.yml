name: Release

on:
  push:
    tags: ['v*']

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in manylinux_2_28 containers: the binary's glibc
          # symbol floor becomes 2.28 (VS Code's own minimum), and
          # GG_STATIC_RUNTIME links libstdc++/libgcc statically so glibc is
          # the ONLY runtime dependency.
          - os: ubuntu-22.04
            target: linux-x64
            triplet: x64-linux
            container: quay.io/pypa/manylinux_2_28_x86_64
            static_runtime: ON
          - os: ubuntu-22.04-arm
            target: linux-arm64
            triplet: arm64-linux
            container: quay.io/pypa/manylinux_2_28_aarch64
            static_runtime: ON
          # macOS floors are pinned to 11.0 (VS Code's own minimum) via the
          # -gg overlay triplets + CMAKE_OSX_DEPLOYMENT_TARGET, and verified.
          - os: macos-14
            target: darwin-arm64
            triplet: arm64-osx-gg
            osx_target: '11.0'
          # Cross-compiled on the Apple Silicon runner (Intel macos-13
          # runners no longer get allocated); tests execute under Rosetta 2.
          - os: macos-14
            target: darwin-x64
            triplet: x64-osx-gg
            osx_target: '11.0'
            osx_arch: x86_64
          - os: windows-2022
            target: win32-x64
            triplet: x64-windows-static
            msvc_arch: x64
          # Native ARM runner so tests actually execute on arm64.
          - os: windows-11-arm
            target: win32-arm64
            triplet: arm64-windows-static
            msvc_arch: arm64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    steps:
      - name: Container build tools (manylinux)
        if: ${{ matrix.container != '' && matrix.container != null }}
        run: |
          dnf install -y -q zip unzip
          /opt/python/cp312-cp312/bin/pip install --quiet cmake ninja
          ln -sf /opt/python/cp312-cp312/bin/cmake /usr/local/bin/cmake
          ln -sf /opt/python/cp312-cp312/bin/ninja /usr/local/bin/ninja
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: ${{ matrix.msvc_arch != '' && matrix.msvc_arch != null }}
        with:
          arch: ${{ matrix.msvc_arch }}
      # VsDevCmd exports its own VCPKG_ROOT (VS-bundled vcpkg); re-point ours.
      - name: Restore VCPKG_ROOT
        if: ${{ matrix.msvc_arch != '' && matrix.msvc_arch != null }}
        shell: bash
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
      - name: Bootstrap vcpkg
        shell: bash
        run: |
          BASELINE=$(grep -oE '"builtin-baseline": *"[0-9a-f]+"' vcpkg.json | grep -oE '[0-9a-f]{40}')
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics || "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gitglasses/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: vcpkg-release-${{ matrix.target }}-${{ hashFiles('vcpkg.json') }}
      - name: Install deps + build
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet ${{ matrix.triplet }} \
            --overlay-triplets=ci/triplets \
            --x-install-root="$HOME/.cache/gitglasses/vcpkg_installed"
          cmake --preset release \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_OVERLAY_TRIPLETS=ci/triplets \
            -DVCPKG_INSTALLED_DIR="$HOME/.cache/gitglasses/vcpkg_installed" \
            -DGG_STATIC_RUNTIME=${{ matrix.static_runtime || 'OFF' }} \
            ${{ matrix.osx_target && format('-DCMAKE_OSX_DEPLOYMENT_TARGET={0}', matrix.osx_target) || '' }} \
            ${{ matrix.osx_arch && format('-DCMAKE_OSX_ARCHITECTURES={0}', matrix.osx_arch) || '' }}
          cmake --build --preset release
      - name: Verify macOS floor
        if: ${{ matrix.osx_target != '' && matrix.osx_target != null }}
        shell: bash
        run: |
          # The binary's minimum OS must equal the intended floor, not
          # whatever the runner's SDK defaulted to.
          minos=$(otool -l build/release/engine/gitglasses-engine \
            | grep -A3 'LC_BUILD_VERSION\|LC_VERSION_MIN_MACOSX' \
            | grep -oE '(minos|version) [0-9.]+' | awk '{print $2}' | head -1)
          echo "minos: $minos (want ${{ matrix.osx_target }})"
          [ "$minos" = "${{ matrix.osx_target }}" ]
      - name: Verify glibc floor (linux)
        if: ${{ matrix.static_runtime == 'ON' }}
        shell: bash
        run: |
          # The binary must not need glibc newer than 2.28 (VS Code's floor)
          # and must not depend on libstdc++/libgcc at all.
          max=$(objdump -T build/release/engine/gitglasses-engine \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "max glibc symbol: $max"
          [ "$(printf '%s\n2.28\n' "${max#GLIBC_}" | sort -V | tail -1)" = "2.28" ]
          ! objdump -p build/release/engine/gitglasses-engine \
            | grep -E 'NEEDED.*(libstdc\+\+|libgcc)'
      - name: Test
        shell: bash
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          ctest --preset release
      # Signs + notarizes automatically once Apple credentials exist as
      # secrets; skips with a notice otherwise (unsigned binaries still work —
      # VSIX contents are not subject to Gatekeeper's quarantine flow).
      - name: Codesign + notarize (macOS)
        if: ${{ matrix.osx_target != '' && matrix.osx_target != null }}
        shell: bash
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then
            echo "::notice::Apple signing secrets not configured — shipping unsigned binary"
            exit 0
          fi
          echo "$APPLE_CERT_P12" | base64 -d > cert.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import cert.p12 -k ci.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" build/release/engine/gitglasses-engine
          ditto -c -k build/release/engine/gitglasses-engine engine.zip
          xcrun notarytool submit engine.zip --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: build/release/engine/gitglasses-engine*
          if-no-files-found: error

  engine-wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.3
      - name: Bootstrap vcpkg
        run: |
          BASELINE=$(grep -oE '"builtin-baseline": *"[0-9a-f]+"' vcpkg.json | grep -oE '[0-9a-f]{40}')
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Cache vcpkg wasm packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gitglasses/vcpkg_wasm
            ~/.cache/vcpkg/archives
          key: vcpkg-wasm-release-${{ hashFiles('vcpkg.json', 'ci/triplets/wasm32-emscripten-gg.cmake') }}
      - name: Install wasm dependencies
        run: |
          cd "$RUNNER_TEMP"
          "$VCPKG_ROOT/vcpkg" install 'libgit2[core,pcre2]' nlohmann-json \
            --triplet wasm32-emscripten-gg \
            --overlay-triplets="$GITHUB_WORKSPACE/ci/triplets" \
            --x-install-root="$HOME/.cache/gitglasses/vcpkg_wasm"
      - name: Build
        run: |
          cmake --preset wasm
          cmake --build --preset wasm
      - name: Harness
        run: node engine/wasm-test/run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: engine-wasm-artifacts
          path: build/wasm/engine/gitglasses-engine-wasm.*
          if-no-files-found: error

  package:
    needs: [engine, engine-wasm]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win32-x64, win32-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: engine-bin/
      - uses: actions/download-artifact@v4
        with:
          name: engine-wasm-artifacts
          path: build/wasm/engine/
      - name: Package VSIX
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p dist
          node scripts/package-vsix.mjs \
            --engine "$(find engine-bin -name 'gitglasses-engine*' -type f | head -1)" \
            --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix

  publish:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix
          generate_release_notes: true

      # Marketplace publishes run automatically once the tokens are configured
      # as repository secrets; without them the steps no-op with a notice.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT not configured — skipping Marketplace publish"
            exit 0
          fi
          for vsix in dist/*.vsix; do
            npx --yes @vscode/vsce publish --packagePath "$vsix"
          done
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT not configured — skipping Open VSX publish"
            exit 0
          fi
          for vsix in dist/*.vsix; do
            npx --yes ovsx publish "$vsix" -p "$OVSX_PAT"
          done
