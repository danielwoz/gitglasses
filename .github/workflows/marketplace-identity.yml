name: Marketplace identity

# Prints the Visual Studio Marketplace user ID of the managed identity that
# the release workflow signs in as (AZURE_CLIENT_ID), which is what the
# gitglasses publisher's Members page asks for. The lookup has to run as the
# identity itself, so it runs here, in the `release` environment, after the
# same azure/login step. Run it once while setting up publishing; see
# docs/releasing.md.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # 499b84ac-1321-427f-aa17-267ca6975798 is the Azure DevOps resource,
      # which also serves the Marketplace.
      - name: Marketplace user ID
        run: |
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "Add this ID as a Contributor of the gitglasses publisher: $id"
          echo "### Marketplace user ID: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
