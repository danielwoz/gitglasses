name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_INSTALLED_DIR: ~/.cache/gitglasses/vcpkg_installed

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: debug
          - os: ubuntu-22.04
            preset: asan
          - os: ubuntu-22.04
            preset: tsan
            cc: clang
            cxx: clang++
          - os: ubuntu-22.04
            preset: release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        run: |
          BASELINE=$(grep -oE '"builtin-baseline": *"[0-9a-f]+"' vcpkg.json | grep -oE '[0-9a-f]{40}')
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gitglasses/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux \
            --x-install-root="$HOME/.cache/gitglasses/vcpkg_installed"

      - name: Configure
        env:
          CC: ${{ matrix.cc || 'cc' }}
          CXX: ${{ matrix.cxx || 'c++' }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          ctest --preset ${{ matrix.preset }}

  engine-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # VsDevCmd exports its own VCPKG_ROOT (VS-bundled vcpkg); re-point ours.
      - name: Restore VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          BASELINE=$(grep -oE '"builtin-baseline": *"[0-9a-f]+"' vcpkg.json | grep -oE '[0-9a-f]{40}')
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gitglasses/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}

      - name: Install dependencies
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static \
            --x-install-root="$HOME/.cache/gitglasses/vcpkg_installed"

      - name: Configure
        shell: bash
        run: |
          cmake --preset release \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DVCPKG_INSTALLED_DIR="$HOME/.cache/gitglasses/vcpkg_installed"

      - name: Build
        shell: bash
        run: cmake --build --preset release

      - name: Test
        shell: bash
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          ctest --preset release

  engine-wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.3

      - name: Bootstrap vcpkg
        run: |
          BASELINE=$(grep -oE '"builtin-baseline": *"[0-9a-f]+"' vcpkg.json | grep -oE '[0-9a-f]{40}')
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg wasm packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gitglasses/vcpkg_wasm
            ~/.cache/vcpkg/archives
          key: vcpkg-wasm-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ci/triplets/wasm32-emscripten-gg.cmake') }}

      # Classic-mode install (run outside the manifest dir): the wasm build
      # needs only libgit2 and nlohmann-json; pcre2/zlib arrive transitively.
      - name: Install wasm dependencies
        run: |
          # Neutral cwd: classic-mode install; vcpkg finds the repo manifest
          # from any cwd inside the checkout and then rejects package args.
          cd "$RUNNER_TEMP"
          "$VCPKG_ROOT/vcpkg" install 'libgit2[core,pcre2]' nlohmann-json \
            --triplet wasm32-emscripten-gg \
            --overlay-triplets="$GITHUB_WORKSPACE/ci/triplets" \
            --x-install-root="$HOME/.cache/gitglasses/vcpkg_wasm"

      - name: Configure
        run: cmake --preset wasm

      - name: Build
        run: cmake --build --preset wasm

      - name: Wasm protocol harness
        run: node engine/wasm-test/run.mjs

  extension:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The TS integration tests exercise the real engine binary.
      - name: Bootstrap vcpkg
        run: |
          BASELINE=$(grep -oE '"builtin-baseline": *"[0-9a-f]+"' vcpkg.json | grep -oE '[0-9a-f]{40}')
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gitglasses/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Build engine
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux \
            --x-install-root="$HOME/.cache/gitglasses/vcpkg_installed"
          cmake --preset release && cmake --build --preset release

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck extension
        working-directory: extension
        run: npx tsc -p tsconfig.json

      - name: Test
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          pnpm test

  extension-e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The e2e suite launches real VS Code against the real engine binary.
      - name: Bootstrap vcpkg
        run: |
          BASELINE=$(grep -oE '"builtin-baseline": *"[0-9a-f]+"' vcpkg.json | grep -oE '[0-9a-f]{40}')
          git init -q "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gitglasses/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
      - name: Build engine
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux \
            --x-install-root="$HOME/.cache/gitglasses/vcpkg_installed"
          cmake --preset release && cmake --build --preset release

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: E2E test
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          xvfb-run -a pnpm --filter gitglasses run test:e2e
