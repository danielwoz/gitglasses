name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            preset: debug
          - os: ubuntu-22.04
            preset: asan
          - os: ubuntu-22.04
            preset: tsan
            cc: clang
            cxx: clang++
          - os: ubuntu-22.04
            preset: release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure
        env:
          CC: ${{ matrix.cc || 'cc' }}
          CXX: ${{ matrix.cxx || 'c++' }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4 --timeout 300

  engine-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows-static

      - name: Configure
        shell: bash
        run: |
          cmake --preset release \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DVCPKG_INSTALLED_DIR="$HOME/.cache/gitglasses/vcpkg_installed"

      - name: Build
        shell: bash
        run: cmake --build --preset release

      - name: Test
        shell: bash
        run: ctest --preset release --parallel 4 --timeout 300

  engine-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: arm64-osx-gg

      - name: Configure
        run: |
          cmake --preset release \
            -DVCPKG_TARGET_TRIPLET=arm64-osx-gg \
            -DVCPKG_OVERLAY_TRIPLETS=ci/triplets \
            -DVCPKG_INSTALLED_DIR="$HOME/.cache/gitglasses/vcpkg_installed" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --parallel 4 --timeout 300

  engine-wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.3

      # The wasm build needs only libgit2 and nlohmann-json; pcre2 and zlib
      # arrive transitively.
      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: wasm32-emscripten-gg
          install-dir: vcpkg_wasm
          packages: libgit2[core,pcre2] nlohmann-json

      - name: Configure
        run: cmake --preset wasm

      - name: Build
        run: cmake --build --preset wasm

      - name: Wasm protocol harness
        run: node engine/wasm-test/run.mjs

  extension:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The TS integration tests exercise the real engine binary.
      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
      - name: Build engine
        run: cmake --preset release && cmake --build --preset release

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # The build re-emits protocol.schema.json into the working tree, so the
      # drift test that regenerates and compares would pass even against a
      # stale committed artifact. This is what actually catches the drift.
      - name: Check the committed protocol schema is current
        run: git diff --exit-code -- packages/protocol/protocol.schema.json

      - name: Typecheck extension
        working-directory: extension
        run: npx tsc -p tsconfig.json

      - name: Test
        run: pnpm test

  # The extension is path-sensitive in ways only Windows exposes: the engine
  # reports repo roots with forward slashes on every platform while VS Code's
  # uri.fsPath uses backslashes, so a comparison that works on Linux can match
  # nothing here and leave every path-dependent feature silently inert. Runs
  # the unit suite and the real-VS-Code e2e suite on Windows for that reason.
  extension-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The unit suite's engine-client tests and the whole e2e suite drive the
      # real binary, so it has to be built here too.
      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows-static
      - name: Build engine
        shell: bash
        run: |
          cmake --preset release \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static \
            -DVCPKG_INSTALLED_DIR="$HOME/.cache/gitglasses/vcpkg_installed"
          cmake --build --preset release

      - name: Install workspace
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build packages
        shell: bash
        run: pnpm build

      - name: Typecheck extension
        shell: bash
        working-directory: extension
        run: npx tsc -p tsconfig.json

      - name: Test
        shell: bash
        run: pnpm test

      # No xvfb wrapper: the runner has a desktop session, and headless.cjs
      # passes straight through to node when a display is present.
      - name: E2E test
        shell: bash
        run: pnpm --filter gitglasses run test:e2e

  extension-e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The e2e suite launches real VS Code against the real engine binary.
      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
      - name: Build engine
        run: cmake --preset release && cmake --build --preset release

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: E2E test
        run: xvfb-run -a pnpm --filter gitglasses run test:e2e
