name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets another workflow, such as a release, require these checks.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request supersedes the checks still running for the
# previous one. Every other run has a group of its own, so pushes to main
# neither wait for nor cancel one another: each commit of main gets its
# checks and its engine artifacts, which `pnpm fetch-engine` and the release
# workflow look up by commit. A calling workflow's name (github.workflow is
# the caller's) keeps its run apart from the pull request's own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each platform's release engine is built and tested once, then shared with
# the jobs that need it as an artifact named after the engine source key
# (node scripts/fetch-engine.mjs --print-key). The builds of main stay
# available for a month, which is what `pnpm fetch-engine` downloads for
# TypeScript-only work.
jobs:
  # ESLint, the formatting of what the change touches (Prettier for TypeScript
  # and JavaScript, clang-format for the changed C++ lines), and the tests of
  # the repository scripts.
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The format check compares against the merge base.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --quiet \
            "clang-format==$(node scripts/check-format.mjs --clang-format-version)"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # The type-aware rules read the workspace packages' declarations.
      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check the formatting of the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: node scripts/check-format.mjs --base "$BASE" --committed

      - name: Test the repository scripts
        run: pnpm test:scripts

  engine:
    name: engine (${{ matrix.preset }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
          - preset: asan
          - preset: tsan
            cc: clang
            cxx: clang++
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure
        env:
          CC: ${{ matrix.cc || 'cc' }}
          CXX: ${{ matrix.cxx || 'c++' }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4 --timeout 300

  engine-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --parallel 4 --timeout 300

      - name: Engine source key
        id: key
        run: echo "key=$(node scripts/fetch-engine.mjs --print-key)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-engine-linux-x64-${{ steps.key.outputs.key }}
          path: build/release/engine/gitglasses-engine
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  engine-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows-static

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release --parallel 4 --timeout 300

      - name: Engine source key
        id: key
        run: echo "key=$(node scripts/fetch-engine.mjs --print-key)" >> "$GITHUB_OUTPUT"

      # Only the executable: the build directory also holds the linker's
      # import library and debug symbols under similar names.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-engine-win32-x64-${{ steps.key.outputs.key }}
          path: build/release/engine/gitglasses-engine.exe
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  engine-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: arm64-osx-gg

      - name: Configure
        run: cmake --preset macos-release

      - name: Build
        run: cmake --build --preset macos-release

      - name: Test
        run: ctest --preset macos-release --parallel 4 --timeout 300

      - name: Engine source key
        id: key
        run: echo "key=$(node scripts/fetch-engine.mjs --print-key)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-engine-darwin-arm64-${{ steps.key.outputs.key }}
          path: build/release/engine/gitglasses-engine
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  engine-wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.3

      # The wasm build needs only libgit2 and nlohmann-json; pcre2 and zlib
      # arrive transitively.
      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: wasm32-emscripten-gg
          install-dir: vcpkg_wasm
          packages: libgit2[core,pcre2] nlohmann-json

      - name: Configure
        run: cmake --preset wasm

      - name: Build
        run: cmake --build --preset wasm

      - name: Wasm protocol harness
        run: node engine/wasm-test/run.mjs

      - name: Engine source key
        id: key
        run: echo "key=$(node scripts/fetch-engine.mjs --print-key)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-engine-wasm-${{ steps.key.outputs.key }}
          path: build/wasm/engine/gitglasses-engine-wasm.*
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  extension:
    needs: engine-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The TS integration tests exercise the real engine binary.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-engine-linux-x64-${{ needs.engine-linux.outputs.key }}
          path: build/release/engine
      - name: Make the engine executable
        run: chmod +x build/release/engine/gitglasses-engine

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # The build re-emits protocol.schema.json into the working tree, so the
      # drift test that regenerates and compares would pass even against a
      # stale committed artifact. This is what actually catches the drift.
      - name: Check the committed protocol schema is current
        run: git diff --exit-code -- packages/protocol/protocol.schema.json

      - name: Typecheck extension
        working-directory: extension
        run: npx tsc -p tsconfig.json

      - name: Test
        run: pnpm test

  # The extension is path-sensitive in ways only Windows exposes: the engine
  # reports repo roots with forward slashes on every platform while VS Code's
  # uri.fsPath uses backslashes, so a comparison that works on Linux can match
  # nothing here and leave every path-dependent feature silently inert. Runs
  # the unit suite and the real-VS-Code e2e suite on Windows for that reason.
  extension-windows:
    needs: engine-windows
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The unit suite's engine-client tests and the whole e2e suite drive the
      # real binary.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-engine-win32-x64-${{ needs.engine-windows.outputs.key }}
          path: build/release/engine

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck extension
        working-directory: extension
        run: npx tsc -p tsconfig.json

      - name: Test
        run: pnpm test

      # No xvfb wrapper: the runner has a desktop session, and headless.cjs
      # passes straight through to node when a display is present.
      - name: E2E test
        run: pnpm --filter gitglasses run test:e2e

      # VS Code's logs from the run: the GitGlasses output channel (engine
      # stderr included) and the extension host log.
      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ runner.os }}
          path: extension/.vscode-test/logs
          if-no-files-found: ignore

  # Runs the suite on the pinned VS Code and on the engines.vscode floor, so a
  # contribution or API that needs a newer VS Code than the manifest promises
  # fails here rather than for users.
  extension-e2e:
    name: extension-e2e (VS Code ${{ matrix.vscode || 'pinned' }})
    needs: engine-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        vscode: ['', '1.90.0']
    env:
      GITGLASSES_E2E_VSCODE: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The e2e suite launches real VS Code against the real engine binary.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-engine-linux-x64-${{ needs.engine-linux.outputs.key }}
          path: build/release/engine
      - name: Make the engine executable
        run: chmod +x build/release/engine/gitglasses-engine

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # The VS Code download; runTests.ts names the pinned release.
      - name: Cache VS Code
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: extension/.vscode-test/vscode-*
          key: vscode-${{ runner.os }}-${{ matrix.vscode || hashFiles('extension/test-e2e/runTests.ts') }}

      - name: E2E test
        run: xvfb-run -a pnpm --filter gitglasses run test:e2e

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ runner.os }}-${{ matrix.vscode || 'pinned' }}
          path: extension/.vscode-test/logs
          if-no-files-found: ignore

  # The web extension (vscode.dev, github.dev) bundles the wasm engine; without
  # it the build skips dist/web entirely. Runs the smoke suite in headless
  # Chromium against a real fixture repository mirrored into MEMFS.
  extension-web:
    needs: engine-wasm
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-engine-wasm-${{ needs.engine-wasm.outputs.key }}
          path: build/wasm/engine

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check the web bundle was built
        run: |
          test -f extension/dist/web/extension.js || {
            echo "::error::pnpm build did not produce extension/dist/web/extension.js"
            exit 1
          }

      # The suite needs the Chromium build of the playwright that
      # @vscode/test-web depends on, so install through that copy's own CLI
      # (playwright is not a direct dependency, and `npx playwright` may run
      # a different version).
      - name: Install Chromium
        working-directory: extension
        run: |
          playwright=$(node -p "require('path').join(require('path').dirname(require('module').createRequire(require.resolve('@vscode/test-web/package.json')).resolve('playwright/package.json')), 'cli.js')")
          node "$playwright" install --with-deps chromium

      - name: Web smoke test
        run: pnpm --filter gitglasses run test:web
