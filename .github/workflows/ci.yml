name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each platform's release engine is built and tested once, then shared with
# the jobs that need it as an artifact named after the engine source key
# (node scripts/fetch-engine.mjs --print-key). The builds of main stay
# available for a month, which is what `pnpm fetch-engine` downloads for
# TypeScript-only work.
jobs:
  engine:
    name: engine (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
          - preset: asan
          - preset: tsan
            cc: clang
            cxx: clang++
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure
        env:
          CC: ${{ matrix.cc || 'cc' }}
          CXX: ${{ matrix.cxx || 'c++' }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 4 --timeout 300

  engine-linux:
    runs-on: ubuntu-22.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --parallel 4 --timeout 300

      - name: Engine source key
        id: key
        run: echo "key=$(node scripts/fetch-engine.mjs --print-key)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ci-engine-linux-x64-${{ steps.key.outputs.key }}
          path: build/release/engine/gitglasses-engine
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  engine-windows:
    runs-on: windows-2022
    outputs:
      key: ${{ steps.key.outputs.key }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows-static

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release --parallel 4 --timeout 300

      - name: Engine source key
        id: key
        run: echo "key=$(node scripts/fetch-engine.mjs --print-key)" >> "$GITHUB_OUTPUT"

      # Only the executable: the build directory also holds the linker's
      # import library and debug symbols under similar names.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-engine-win32-x64-${{ steps.key.outputs.key }}
          path: build/release/engine/gitglasses-engine.exe
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  engine-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: arm64-osx-gg

      - name: Configure
        run: cmake --preset macos-release

      - name: Build
        run: cmake --build --preset macos-release

      - name: Test
        run: ctest --preset macos-release --parallel 4 --timeout 300

      - name: Engine source key
        id: key
        run: echo "key=$(node scripts/fetch-engine.mjs --print-key)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ci-engine-darwin-arm64-${{ steps.key.outputs.key }}
          path: build/release/engine/gitglasses-engine
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}

  engine-wasm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.3

      # The wasm build needs only libgit2 and nlohmann-json; pcre2 and zlib
      # arrive transitively.
      - uses: ./.github/actions/setup-vcpkg
        with:
          triplet: wasm32-emscripten-gg
          install-dir: vcpkg_wasm
          packages: libgit2[core,pcre2] nlohmann-json

      - name: Configure
        run: cmake --preset wasm

      - name: Build
        run: cmake --build --preset wasm

      - name: Wasm protocol harness
        run: node engine/wasm-test/run.mjs

  extension:
    needs: engine-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The TS integration tests exercise the real engine binary.
      - uses: actions/download-artifact@v4
        with:
          name: ci-engine-linux-x64-${{ needs.engine-linux.outputs.key }}
          path: build/release/engine
      - name: Make the engine executable
        run: chmod +x build/release/engine/gitglasses-engine

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # The build re-emits protocol.schema.json into the working tree, so the
      # drift test that regenerates and compares would pass even against a
      # stale committed artifact. This is what actually catches the drift.
      - name: Check the committed protocol schema is current
        run: git diff --exit-code -- packages/protocol/protocol.schema.json

      - name: Typecheck extension
        working-directory: extension
        run: npx tsc -p tsconfig.json

      - name: Test
        run: pnpm test

  # The extension is path-sensitive in ways only Windows exposes: the engine
  # reports repo roots with forward slashes on every platform while VS Code's
  # uri.fsPath uses backslashes, so a comparison that works on Linux can match
  # nothing here and leave every path-dependent feature silently inert. Runs
  # the unit suite and the real-VS-Code e2e suite on Windows for that reason.
  extension-windows:
    needs: engine-windows
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The unit suite's engine-client tests and the whole e2e suite drive the
      # real binary.
      - uses: actions/download-artifact@v4
        with:
          name: ci-engine-win32-x64-${{ needs.engine-windows.outputs.key }}
          path: build/release/engine

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck extension
        working-directory: extension
        run: npx tsc -p tsconfig.json

      - name: Test
        run: pnpm test

      # No xvfb wrapper: the runner has a desktop session, and headless.cjs
      # passes straight through to node when a display is present.
      - name: E2E test
        run: pnpm --filter gitglasses run test:e2e

  extension-e2e:
    needs: engine-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The e2e suite launches real VS Code against the real engine binary.
      - uses: actions/download-artifact@v4
        with:
          name: ci-engine-linux-x64-${{ needs.engine-linux.outputs.key }}
          path: build/release/engine
      - name: Make the engine executable
        run: chmod +x build/release/engine/gitglasses-engine

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: E2E test
        run: xvfb-run -a pnpm --filter gitglasses run test:e2e
